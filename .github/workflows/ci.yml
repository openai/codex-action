name: Verify TypeScript Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build bundles
        run: pnpm run build

      - name: Ensure dist matches bundled output
        run: |
          status_output="$(git status --short -- dist)"
          if [[ -n "$status_output" ]]; then
            echo '::error::Detected modified files in dist/ after running pnpm run build. Please rebuild locally and commit the updated bundles.'
            echo "$status_output"
            exit 1
          fi

      - name: Verify drop-sudo hardening
        run: |
          service_dir="/run/codex-action-drop-sudo-test"
          service_socket="$service_dir/control.sock"
          sudo mkdir "$service_dir"
          sudo chown runner:users "$service_dir"
          SOCKET_PATH="$service_socket" node -e \
            'require("node:net").createServer().listen(process.env.SOCKET_PATH)' &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            if test -S "$service_socket"; then
              break
            fi
            sleep 0.1
          done
          test -S "$service_socket"
          sudo chown root:users "$service_socket"
          sudo chmod 0660 "$service_socket"
          sudo chown root:root "$service_dir"
          test -w "$service_socket"
          node dist/main.js drop-sudo --user runner --group sudo
          if test -w "$service_socket"; then
            echo '::error::drop-sudo left a privileged service accessible.'
            exit 1
          fi
